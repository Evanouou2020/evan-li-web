  <title>Earthquake List — Evan Li</title>

<body class="wide">

  <nav>
    <a href="index.html">About</a>
    <a href="posts.html">Posts</a>
    <div class="nav-dropdown active">
      <button class="nav-dropdown-toggle">Earthquake</button>

  <main>
    <h1>Earthquake List</h1>
    <p>Live earthquake data, straight from the USGS.</p>

    <div class="quake-columns">
      <div class="quake-column">
        <h2>Recent earthquakes in California</h2>
        <p class="section-note">Live from the USGS, past 30 days, all magnitudes.</p>
        <ul class="quake-list" id="ca-quake-list">
          <li class="state-msg">Loading…</li>
        </ul>
        <button class="show-more-btn" id="ca-show-more" hidden>Show more</button>
      </div>

      <div class="quake-column">
        <h2>Major earthquakes worldwide</h2>
        <p class="section-note">Live from the USGS, past 5 years.</p>
        <div class="mag-filter">
          <button data-mag="6">M6+</button>
          <button data-mag="7" class="active">M7+</button>
          <button data-mag="8">M8+</button>
          <button data-mag="9">M9+</button>
        </div>
        <ul class="quake-list" id="major-quake-list">
          <li class="state-msg">Loading…</li>
        </ul>
        <button class="show-more-btn" id="major-show-more" hidden>Show more</button>
      </div>
    </div>
  </main>

  <footer>
    <p id="last-updated"></p>
    <p id="view-counts"></p>
  </footer>

  <script src="bg-shift.js"></script>
